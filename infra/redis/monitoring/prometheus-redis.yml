# Prometheus Redis 监控配置

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Redis Master 监控
  - job_name: 'redis-master'
    static_configs:
      - targets: ['stock-race-redis-master:6379']
    metrics_path: /scrape
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: stock-race-redis-exporter:9121

  # Redis Exporter
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['stock-race-redis-exporter:9121']

  # Node Exporter（系统监控）
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

# 告警规则
rule_files:
  - "redis_alerts.yml"
