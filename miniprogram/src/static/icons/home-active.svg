<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 81 81" width="81" height="81">
  <!-- 西式复古精英风格 - 首页图标（选中状态） -->
  <!-- 背景圆 -->
  <circle cx="40.5" cy="40.5" r="38" fill="#1A365D" opacity="0.1"/>

  <!-- 古典门廊 - 屋顶 -->
  <path d="M40.5 12 L65 32 L16 32 Z" fill="#1A365D" stroke="#1A365D" stroke-width="2" stroke-linejoin="round"/>

  <!-- 屋顶装饰线 -->
  <line x1="20" y1="30" x2="61" y2="30" stroke="#D4AF37" stroke-width="1.5"/>

  <!-- 左侧罗马柱 -->
  <rect x="22" y="32" width="6" height="28" fill="#F5F5DC" stroke="#1A365D" stroke-width="1.5"/>
  <line x1="22" y1="36" x2="28" y2="36" stroke="#1A365D" stroke-width="0.8"/>
  <line x1="22" y1="44" x2="28" y2="44" stroke="#1A365D" stroke-width="0.8"/>
  <line x1="22" y1="52" x2="28" y2="52" stroke="#1A365D" stroke-width="0.8"/>
  <!-- 柱头 -->
  <rect x="21" y="30" width="8" height="3" fill="#D4AF37" stroke="#1A365D" stroke-width="1"/>
  <!-- 柱基 -->
  <rect x="21" y="59" width="8" height="3" fill="#D4AF37" stroke="#1A365D" stroke-width="1"/>

  <!-- 右侧罗马柱 -->
  <rect x="53" y="32" width="6" height="28" fill="#F5F5DC" stroke="#1A365D" stroke-width="1.5"/>
  <line x1="53" y1="36" x2="59" y2="36" stroke="#1A365D" stroke-width="0.8"/>
  <line x1="53" y1="44" x2="59" y2="44" stroke="#1A365D" stroke-width="0.8"/>
  <line x1="53" y1="52" x2="59" y2="52" stroke="#1A365D" stroke-width="0.8"/>
  <!-- 柱头 -->
  <rect x="52" y="30" width="8" height="3" fill="#D4AF37" stroke="#1A365D" stroke-width="1"/>
  <!-- 柱基 -->
  <rect x="52" y="59" width="8" height="3" fill="#D4AF37" stroke="#1A365D" stroke-width="1"/>

  <!-- 门楣 -->
  <rect x="31" y="35" width="19" height="2" fill="#D4AF37" stroke="#D4AF37" stroke-width="1"/>

  <!-- 门 -->
  <rect x="33" y="38" width="15" height="22" fill="#F5F5DC" stroke="#1A365D" stroke-width="1.5" rx="1"/>
  <!-- 门把手 -->
  <circle cx="44" cy="50" r="1.8" fill="#D4AF37" stroke="#1A365D" stroke-width="0.5"/>

  <!-- 底部月桂叶装饰 -->
  <path d="M35 65 Q40.5 69 46 65" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
  <path d="M37 63 L35 65 L37 67" fill="none" stroke="#D4AF37" stroke-width="1.2"/>
  <path d="M44 63 L46 65 L44 67" fill="none" stroke="#D4AF37" stroke-width="1.2"/>

  <!-- 台阶 -->
  <line x1="18" y1="62" x2="63" y2="62" stroke="#1A365D" stroke-width="2"/>
  <line x1="20" y1="65" x2="61" y2="65" stroke="#1A365D" stroke-width="1.5"/>
</svg>