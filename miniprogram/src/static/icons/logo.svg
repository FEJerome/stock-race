<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144">
  <!-- 西式复古精英风格 - 小程序Logo -->

  <!-- 背景 - 深海军蓝 -->
  <rect x="0" y="0" width="144" height="144" fill="#1A365D" rx="22"/>

  <!-- 外圈月桂花环 -->
  <g stroke="#D4AF37" stroke-width="1.5" fill="none">
    <!-- 左侧月桂叶 -->
    <path d="M35 72 Q25 55 30 40"/>
    <path d="M32 68 Q22 52 27 38"/>
    <path d="M30 64 Q20 48 25 35"/>
    <path d="M28 60 Q18 45 23 32"/>
    <path d="M27 56 Q17 42 22 30"/>
    <path d="M26 52 Q16 38 21 28"/>

    <!-- 右侧月桂叶 -->
    <path d="M109 72 Q119 55 114 40"/>
    <path d="M112 68 Q122 52 117 38"/>
    <path d="M114 64 Q124 48 119 35"/>
    <path d="M116 60 Q126 45 121 32"/>
    <path d="M117 56 Q127 42 122 30"/>
    <path d="M118 52 Q128 38 123 28"/>
  </g>

  <!-- 底部飘带 -->
  <path d="M40 105 Q72 115 104 105 L104 112 Q72 122 40 112 Z" fill="#D4AF37"/>
  <text x="72" y="114" font-family="serif" font-size="8" fill="#1A365D" text-anchor="middle" font-weight="bold">EST. 2024</text>

  <!-- 猫头鹰头部轮廓 -->
  <ellipse cx="72" cy="65" rx="35" ry="32" fill="#F5F5DC" stroke="#D4AF37" stroke-width="2"/>

  <!-- 猫头鹰耳朵 -->
  <path d="M42 48 L38 35 L50 42" fill="#F5F5DC" stroke="#D4AF37" stroke-width="1.5"/>
  <path d="M102 48 L106 35 L94 42" fill="#F5F5DC" stroke="#D4AF37" stroke-width="1.5"/>

  <!-- 齿轮眼睛 - 左 -->
  <circle cx="58" cy="62" r="12" fill="#F5F5DC" stroke="#1A365D" stroke-width="2"/>
  <!-- 齿轮齿 -->
  <g stroke="#1A365D" stroke-width="1.5">
    <line x1="58" y1="47" x2="58" y2="50"/>
    <line x1="58" y1="74" x2="58" y2="77"/>
    <line x1="43" y1="62" x2="46" y2="62"/>
    <line x1="70" y1="62" x2="73" y2="62"/>
  </g>
  <!-- 瞳孔 -->
  <circle cx="58" cy="62" r="5" fill="#D4AF37" stroke="#1A365D" stroke-width="1"/>
  <circle cx="58" cy="62" r="2.5" fill="#1A365D"/>

  <!-- 齿轮眼睛 - 右 -->
  <circle cx="86" cy="62" r="12" fill="#F5F5DC" stroke="#1A365D" stroke-width="2"/>
  <!-- 齿轮齿 -->
  <g stroke="#1A365D" stroke-width="1.5">
    <line x1="86" y1="47" x2="86" y2="50"/>
    <line x1="86" y1="74" x2="86" y2="77"/>
    <line x1="71" y1="62" x2="74" y2="62"/>
    <line x1="98" y1="62" x2="101" y2="62"/>
  </g>
  <!-- 瞳孔 -->
  <circle cx="86" cy="62" r="5" fill="#D4AF37" stroke="#1A365D" stroke-width="1"/>
  <circle cx="86" cy="62" r="2.5" fill="#1A365D"/>

  <!-- 额头上升折线（投资收益） -->
  <polyline points="52 48 62 42 72 46 82 38 92 32" fill="none" stroke="#1A365D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="92" cy="32" r="3" fill="#D4AF37" stroke="#1A365D" stroke-width="1"/>

  <!-- 喙 -->
  <path d="M72 72 L68 82 L72 80 L76 82 Z" fill="#D4AF37" stroke="#1A365D" stroke-width="1"/>

  <!-- 领结 -->
  <path d="M60 88 L72 94 L84 88 L72 82 Z" fill="#D4AF37" stroke="#1A365D" stroke-width="1.5"/>
  <circle cx="72" cy="88" r="4" fill="#D4AF37" stroke="#1A365D" stroke-width="1"/>

  <!-- 装饰性边框线 -->
  <rect x="8" y="8" width="128" height="128" fill="none" stroke="#D4AF37" stroke-width="1" rx="18" opacity="0.5"/>
  <rect x="12" y="12" width="120" height="120" fill="none" stroke="#D4AF37" stroke-width="0.5" rx="16" opacity="0.3"/>
</svg>