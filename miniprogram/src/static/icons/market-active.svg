<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 81 81" width="81" height="81">
  <!-- 西式复古精英风格 - 行情图标（选中状态） -->
  <!-- 背景 -->
  <circle cx="40.5" cy="40.5" r="38" fill="#1A365D" opacity="0.1"/>

  <!-- 装饰边框 -->
  <rect x="10" y="10" width="61" height="61" fill="none" stroke="#D4AF37" stroke-width="0.8" rx="2"/>

  <!-- 复古股票行情纸带背景框 -->
  <rect x="15" y="18" width="51" height="45" fill="#F5F5DC" stroke="#1A365D" stroke-width="2" rx="1"/>

  <!-- 顶部装饰线 -->
  <line x1="15" y1="24" x2="66" y2="24" stroke="#D4AF37" stroke-width="2"/>

  <!-- 上升趋势折线 -->
  <polyline points="20,50 30,45 40,48 50,35 60,30" fill="none" stroke="#1A365D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 数据点 -->
  <circle cx="20" cy="50" r="3" fill="#1A365D"/>
  <circle cx="30" cy="45" r="3" fill="#1A365D"/>
  <circle cx="40" cy="48" r="3" fill="#1A365D"/>
  <circle cx="50" cy="35" r="3.5" fill="#D4AF37" stroke="#1A365D" stroke-width="1"/>
  <circle cx="60" cy="30" r="4" fill="#D4AF37" stroke="#1A365D" stroke-width="1.5"/>

  <!-- 右侧装饰竖线 -->
  <line x1="70" y1="18" x2="70" y2="63" stroke="#1A365D" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- 左侧刻度 -->
  <line x1="12" y1="30" x2="15" y2="30" stroke="#1A365D" stroke-width="1.5"/>
  <line x1="12" y1="40" x2="15" y2="40" stroke="#1A365D" stroke-width="1.5"/>
  <line x1="12" y1="50" x2="15" y2="50" stroke="#1A365D" stroke-width="1.5"/>

  <!-- 底部装饰 -->
  <path d="M25 68 L40.5 73 L56 68" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Art Deco装饰角 -->
  <path d="M15 18 L20 23" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <path d="M66 18 L61 23" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <path d="M15 63 L20 58" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <path d="M66 63 L61 58" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
</svg>