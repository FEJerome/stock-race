name: CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/stock-race-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/stock-race-backend:${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/stock-race-backend:${{ github.ref_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          NODE_ENV=production

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/stock-race-frontend:latest
          ${{ secrets.DOCKER_USERNAME }}/stock-race-frontend:${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/stock-race-frontend:${{ github.ref_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VITE_API_URL=${{ vars.PRODUCTION_API_URL }}

    - name: Build and push AI service image
      uses: docker/build-push-action@v5
      with:
        context: ./ai-service
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/stock-race-ai-service:latest
          ${{ secrets.DOCKER_USERNAME }}/stock-race-ai-service:${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/stock-race-ai-service:${{ github.ref_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push data service image
      uses: docker/build-push-action@v5
      with:
        context: ./data-service
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/stock-race-data-service:latest
          ${{ secrets.DOCKER_USERNAME }}/stock-race-data-service:${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/stock-race-data-service:${{ github.ref_name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Deployment steps (example for Kubernetes)
    - name: Deploy to Kubernetes
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "Deploying to production..."
        # Add your deployment commands here
        # Example:
        # kubectl apply -f k8s/
        # kubectl rollout status deployment/stock-race-backend
        # kubectl rollout status deployment/stock-race-frontend
        # kubectl rollout status deployment/stock-race-ai-service
        # kubectl rollout status deployment/stock-race-data-service

    - name: Run smoke tests
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "Running smoke tests..."
        # Add smoke test commands here
        # Example:
        # curl -f ${{ vars.PRODUCTION_API_URL }}/health
        # curl -f ${{ vars.PRODUCTION_FRONTEND_URL }}

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: true
        files: |
          docker-compose.prod.yml
          README.md
          CHANGELOG.md