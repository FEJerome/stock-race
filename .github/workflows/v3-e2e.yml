name: V3 E2E

on:
  push:
    branches: [ main ]
    paths:
      - 'v3/**'
      - 'v3-e2e/**'
      - '.github/workflows/v3-e2e.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'v3/**'
      - 'v3-e2e/**'
      - '.github/workflows/v3-e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: |
          v3/package-lock.json
          v3-e2e/package-lock.json

    - name: Install v3 dependencies (frozen manifest)
      working-directory: ./v3
      run: npm ci

    - name: Install e2e dependencies (standalone package)
      working-directory: ./v3-e2e
      run: npm ci

    - name: Install Chromium for Playwright
      working-directory: ./v3-e2e
      run: npx playwright install --with-deps chromium

    - name: Run the playable-slice e2e (deterministic fake, zero network at test time)
      working-directory: ./v3-e2e
      run: npm test

    - name: Upload Playwright report and screen evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: v3-e2e-report
        path: |
          v3-e2e/playwright-report/
          v3-e2e/evidence/
          v3-e2e/test-results/
        if-no-files-found: ignore
