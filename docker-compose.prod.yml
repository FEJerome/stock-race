version: '3.8'

# 生产环境配置文件
# 使用方法: docker-compose -f docker-compose.prod.yml up -d --build

services:
  # PostgreSQL Database (元数据)
  postgres:
    image: postgres:15-alpine
    container_name: stock-race-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_race_prod}
      POSTGRES_USER: ${POSTGRES_USER:-prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - stock-race-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prod_user}"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # TimescaleDB (时序数据)
  timescaledb:
    image: timescale/timescaledb:2.11-pg15
    container_name: stock-race-timescaledb-prod
    restart: always
    environment:
      POSTGRES_DB: ${TSDB_DB:-stock_race_tsdb_prod}
      POSTGRES_USER: ${TSDB_USER:-tsdb_user}
      POSTGRES_PASSWORD: ${TSDB_PASSWORD:?TSDB_PASSWORD must be set}
    volumes:
      - timescaledb_data_prod:/var/lib/postgresql/data
      - ./docker/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - stock-race-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TSDB_USER:-tsdb_user}"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: stock-race-redis-prod
    restart: always
    command: >
      sh -c "redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --appendonly yes
      --maxmemory ${REDIS_MAX_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru"
    volumes:
      - redis_data_prod:/data
    networks:
      - stock-race-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: stock-race-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - backend/.env.production
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-stock_race_prod}
      - DB_USER=${POSTGRES_USER:-prod_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      - NODE_ENV=production
      - AI_SERVICE_URL=http://ai-service:8000
      - DATA_SERVICE_URL=http://data-service:8001
    volumes:
      - backend_logs_prod:/var/log/stock-race
    networks:
      - stock-race-prod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile.prod
    container_name: stock-race-ai-service-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ai-service/.env.production
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-stock_race_prod}
      - DB_USER=${POSTGRES_USER:-prod_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      - DEBUG=False
      - BACKEND_URL=http://backend:3001
      - DATA_SERVICE_URL=http://data-service:8001
    volumes:
      - ai_service_logs_prod:/var/log/stock-race
    networks:
      - stock-race-prod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Data Service
  data-service:
    build:
      context: ./data-service
      dockerfile: Dockerfile.prod
    container_name: stock-race-data-service-prod
    restart: always
    depends_on:
      timescaledb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - data-service/.env.production
    environment:
      - TSDB_HOST=timescaledb
      - TSDB_PORT=5432
      - TSDB_NAME=${TSDB_DB:-stock_race_tsdb_prod}
      - TSDB_USER=${TSDB_USER:-tsdb_user}
      - TSDB_PASSWORD=${TSDB_PASSWORD:?TSDB_PASSWORD must be set}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-stock_race_prod}
      - DB_USER=${POSTGRES_USER:-prod_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      - DEBUG=False
      - BACKEND_URL=http://backend:3001
    volumes:
      - data_service_logs_prod:/var/log/stock-race
    networks:
      - stock-race-prod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: stock-race-frontend-prod
    restart: always
    depends_on:
      - backend
    networks:
      - stock-race-prod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: stock-race-nginx-prod
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs_prod:/var/log/nginx
    networks:
      - stock-race-prod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: stock-race-prometheus-prod
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_prod:/prometheus
    networks:
      - stock-race-prod-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: stock-race-grafana-prod
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      - GF_SERVER_ROOT_URL=${GRAFANA_URL:-http://localhost:3002}
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data_prod:/var/lib/grafana
    networks:
      - stock-race-prod-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

networks:
  stock-race-prod-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data_prod:
    driver: local
  timescaledb_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  backend_logs_prod:
    driver: local
  ai_service_logs_prod:
    driver: local
  data_service_logs_prod:
    driver: local
  nginx_logs_prod:
    driver: local
  prometheus_data_prod:
    driver: local
  grafana_data_prod:
    driver: local
