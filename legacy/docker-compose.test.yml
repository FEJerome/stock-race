version: '3.8'

# 测试专用 Docker Compose 配置
# 用于 CI/CD 流水线运行集成测试
# 特点：
# 1. 轻量级（只启动必要服务）
# 2. 自动化数据库初始化和迁移
# 3. 测试完成后自动清理
#
# 使用方法：
#   ./scripts/run-integration-tests.sh --ci
#

services:

  # ==================== 基础设施 ====================
  redis:
    image: redis:7-alpine
    container_name: stock-race-redis-test
    restart: "no"
    ports:
      - "6381:6379"
    networks:
      - stock-race-test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: stock-race-postgres-test
    restart: "no"
    environment:
      POSTGRES_DB: stock_race_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - ./backend/prisma/migrations:/docker-entrypoint-initdb.d
    networks:
      - stock-race-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==================== Backend 测试运行器 ====================
  backend-test:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: stock-race-backend-test
    restart: "no"
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/prisma:/app/prisma
      - ./backend/package.json:/app/package.json
      - ./backend/jest.config.js:/app/jest.config.js
    environment:
      - NODE_ENV=test
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/stock_race_test
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://trading-ai-service:8000
      - DATA_SERVICE_URL=http://market-data-service:8001
      - STRICT_MODE=false
      - DISABLE_DATA_FALLBACK=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stock-race-test-network
    command: >
      sh -c "
        npx prisma migrate deploy &&
        npx prisma generate &&
        npm run test:integration
      "

  # ==================== Mock 服务（用于测试） ====================
  trading-ai-service:
    image: mockserver/mockserver:5.15.0
    container_name: stock-race-ai-mock
    restart: "no"
    ports:
      - "8002:1080"
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/mock_expectations.json
    volumes:
      - ./tests/mocks:/config
    networks:
      - stock-race-test-network

  market-data-service:
    image: mockserver/mockserver:5.15.0
    container_name: stock-race-data-mock
    restart: "no"
    ports:
      - "8003:1080"
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/mock_expectations.json
    volumes:
      - ./tests/mocks:/config
    networks:
      - stock-race-test-network

networks:
  stock-race-test-network:
    driver: bridge

# 注意：测试环境不使用持久化卷，每次启动都是干净的
