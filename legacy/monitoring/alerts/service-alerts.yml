# Prometheus告警规则
# 服务可用性和性能监控

groups:
  - name: service_availability
    interval: 30s
    rules:
      # 服务宕机告警
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "服务 {{ $labels.instance }} 宕机"
          description: "服务 {{ $labels.service }} ({{ $labels.instance }}) 已经宕机超过1分钟"

  - name: api_performance
    interval: 30s
    rules:
      # API响应时间告警
      - alert: HighAPILatency
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 1
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "API响应时间过高"
          description: "服务 {{ $labels.service }} 的P95响应时间超过1秒 (当前值: {{ $value }}s)"

      # API错误率告警
      - alert: HighAPIErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m]) /
          rate(http_requests_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "API错误率过高"
          description: "服务 {{ $labels.service }} 的5xx错误率超过1% (当前值: {{ $value | humanizePercentage }})"

  - name: resource_usage
    interval: 30s
    rules:
      # 高CPU使用率告警
      - alert: HighCPUUsage
        expr: |
          100 - (avg by(instance) (rate(process_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "CPU使用率过高"
          description: "实例 {{ $labels.instance }} 的CPU使用率超过80% (当前值: {{ $value }}%)"

      # 高内存使用率告警
      - alert: HighMemoryUsage
        expr: |
          (process_resident_memory_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 10m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "内存使用率过高"
          description: "实例 {{ $labels.instance }} 的内存使用率超过85% (当前值: {{ $value }}%)"

  - name: database_health
    interval: 30s
    rules:
      # 数据库连接数告警
      - alert: HighDatabaseConnections
        expr: |
          pg_stat_database_numbackends / pg_settings_max_connections > 0.8
        for: 10m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "数据库连接数过高"
          description: "数据库 {{ $labels.datname }} 连接数使用超过80% (当前: {{ $value }}%)"

      # 慢查询告警
      - alert: SlowQueries
        expr: |
          rate(pg_stat_statements_calls_total{queryid!=""}[5m]) > 100
        for: 10m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "数据库慢查询过多"
          description: "检测到大量慢查询，查询ID: {{ $labels.queryid }}"

  - name: cache_health
    interval: 30s
    rules:
      # Redis内存使用率告警
      - alert: HighRedisMemoryUsage
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 10m
        labels:
          severity: critical
          category: cache
        annotations:
          summary: "Redis内存使用率过高"
          description: "Redis {{ $labels.instance }} 内存使用率超过90%"

      # Redis连接数告警
      - alert: HighRedisConnections
        expr: redis_connected_clients > 500
        for: 10m
        labels:
          severity: warning
          category: cache
        annotations:
          summary: "Redis连接数过高"
          description: "Redis {{ $labels.instance }} 连接数超过500 (当前: {{ $value }})"

  - name: ai_service_health
    interval: 30s
    rules:
      # AI服务请求失败率告警
      - alert: HighAIServiceFailureRate
        expr: |
          rate(ai_requests_total{status="failed"}[5m]) /
          rate(ai_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          category: ai-service
        annotations:
          summary: "AI服务失败率过高"
          description: "AI服务失败率超过5% (当前值: {{ $value | humanizePercentage }})"

      # AI服务响应时间告警
      - alert: SlowAIServiceResponse
        expr: |
          histogram_quantile(0.95,
            rate(ai_request_duration_seconds_bucket[5m])
          ) > 30
        for: 5m
        labels:
          severity: warning
          category: ai-service
        annotations:
          summary: "AI服务响应时间过长"
          description: "AI服务P95响应时间超过30秒 (当前: {{ $value }}s)"

  - name: data_service_health
    interval: 30s
    rules:
      # 数据采集失败告警
      - alert: DataCollectionFailure
        expr: |
          rate(data_collection_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          category: data-service
        annotations:
          summary: "数据采集失败率过高"
          description: "数据源 {{ $labels.source }} 采集失败"

      # 数据延迟告警
      - alert: DataLatencyHigh
        expr: |
          data_freshness_seconds > 300
        for: 5m
        labels:
          severity: warning
          category: data-service
        annotations:
          summary: "数据延迟过高"
          description: "数据 {{ $labels.symbol }} 延迟超过5分钟 (当前: {{ $value }}s)"
