version: '3.8'

# 生产环境配置文件
# 使用方法: docker-compose -f docker-compose.prod.yml up -d --build

services:
  # PostgreSQL Database (元数据)
  postgres:
    image: postgres:15-alpine
    container_name: stock-race-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: stock_race
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_change_me_in_production}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stock-race-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # TimescaleDB (时序数据)
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: stock-race-timescaledb-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: stock_race_tsdb
      POSTGRES_USER: timescale
      POSTGRES_PASSWORD: ${TSDB_PASSWORD:-password_change_me_in_production}
    ports:
      - "${TSDB_PORT:-5433}:5432"
    volumes:
      - timescaledb_data_prod:/var/lib/postgresql/data
      - ./docker/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stock-race-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timescale"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: stock-race-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_change_me_in_production}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - stock-race-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_change_me_in_production}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: stock-race-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-stock_race}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres_change_me_in_production}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_change_me_in_production}@redis:6379
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - AI_SERVICE_URL=http://ai-service:8000
      - DATA_SERVICE_URL=http://data-service:8001
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_key_change_me_in_production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - API_KEY=${API_KEY:-stock-race-api-key-production}
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:-stock-race-ai-key-production}
      - DATA_SERVICE_API_KEY=${DATA_SERVICE_API_KEY:-stock-race-data-key-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://frontend:3000}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - backend_logs_prod:/app/logs
    networks:
      - stock-race-prod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile.prod
    container_name: stock-race-ai-service-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-stock_race}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres_change_me_in_production}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_change_me_in_production}@redis:6379
      - BACKEND_URL=http://backend:3001
      - DATA_SERVICE_URL=http://data-service:8001
      - API_KEY=${API_KEY:-stock-race-api-key-production}
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:-stock-race-ai-key-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - QWEN_API_KEY=${QWEN_API_KEY}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    volumes:
      - ai_service_logs_prod:/app/logs
    networks:
      - stock-race-prod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Data Service
  data-service:
    build:
      context: ./data-service
      dockerfile: Dockerfile.prod
    container_name: stock-race-data-service-prod
    restart: always
    depends_on:
      timescaledb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - DEBUG=False
      - TSDB_HOST=timescaledb
      - TSDB_PORT=5432
      - TSDB_NAME=${TSDB_DB:-stock_race_tsdb}
      - TSDB_USER=${TSDB_USER:-timescale}
      - TSDB_PASSWORD=${TSDB_PASSWORD:-password_change_me_in_production}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-stock_race}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres_change_me_in_production}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_change_me_in_production}@redis:6379
      - BACKEND_URL=http://backend:3001
      - AI_SERVICE_URL=http://ai-service:8000
      - API_KEY=${API_KEY:-stock-race-api-key-production}
      - DATA_SERVICE_API_KEY=${DATA_SERVICE_API_KEY:-stock-race-data-key-production}
    ports:
      - "${DATA_SERVICE_PORT:-8001}:8001"
    volumes:
      - data_service_logs_prod:/app/logs
    networks:
      - stock-race-prod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: stock-race-frontend-prod
    restart: always
    depends_on:
      - backend
      - ai-service
      - data-service
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_API_URL=http://backend:3001/api
      - VITE_WS_URL=ws://backend:3001
      - VITE_APP_NAME=Stock Race
      - VITE_APP_VERSION=1.0.0
      - VITE_DEBUG=false
      - VITE_ENABLE_AI_ANALYSIS=true
      - VITE_ENABLE_REALTIME_DATA=true
      - VITE_ENABLE_COMPETITION=true
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - stock-race-prod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # pgAdmin (Database Management - Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: stock-race-pgadmin-prod
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@stock-race.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data_prod:/var/lib/pgadmin
    networks:
      - stock-race-prod-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Redis Commander (Redis Management - Optional)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: stock-race-redis-commander-prod
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_change_me_in_production}
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    networks:
      - stock-race-prod-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

networks:
  stock-race-prod-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data_prod:
  timescaledb_data_prod:
  redis_data_prod:
  pgadmin_data_prod:
  backend_logs_prod:
  ai_service_logs_prod:
  data_service_logs_prod:
