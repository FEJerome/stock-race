# Redis 渐进式部署配置 - 阶段三：Cluster集群
# 适用场景：大规模生产环境 (1000+用户)
# 成本：¥200-500/月
# 可用性：99.95%（分片+高可用）
#
# 架构：
#   Master1 (Slot 0-5460)    <---- Slave1
#   Master2 (Slot 5461-10922) <---- Slave2
#   Master3 (Slot 10923-16383) <---- Slave3
#

version: '3.8'

services:
  # Master 1
  redis-master-1:
    image: redis:7-alpine
    container_name: stock-race-redis-master-1
    restart: unless-stopped
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes-6379.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redis123}
      --masterauth ${REDIS_PASSWORD:-redis123}
    ports:
      - "6379:6379"
      - "16379:16379"
    volumes:
      - redis_master1_data:/data
    networks:
      - stock-race-network
    deploy:
      resources:
        limits:
          memory: 5G

  # Master 2
  redis-master-2:
    image: redis:7-alpine
    container_name: stock-race-redis-master-2
    restart: unless-stopped
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes-6379.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redis123}
      --masterauth ${REDIS_PASSWORD:-redis123}
    ports:
      - "6380:6379"
      - "16380:16379"
    volumes:
      - redis_master2_data:/data
    networks:
      - stock-race-network
    deploy:
      resources:
        limits:
          memory: 5G

  # Master 3
  redis-master-3:
    image: redis:7-alpine
    container_name: stock-race-redis-master-3
    restart: unless-stopped
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes-6379.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redis123}
      --masterauth ${REDIS_PASSWORD:-redis123}
    ports:
      - "6381:6379"
      - "16381:16379"
    volumes:
      - redis_master3_data:/data
    networks:
      - stock-race-network
    deploy:
      resources:
        limits:
          memory: 5G

  # Slave 1
  redis-slave-1:
    image: redis:7-alpine
    container_name: stock-race-redis-slave-1
    restart: unless-stopped
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes-6379.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redis123}
      --masterauth ${REDIS_PASSWORD:-redis123}
    ports:
      - "6382:6379"
      - "16382:16379"
    volumes:
      - redis_slave1_data:/data
    networks:
      - stock-race-network
    deploy:
      resources:
        limits:
          memory: 5G

  # Slave 2
  redis-slave-2:
    image: redis:7-alpine
    container_name: stock-race-redis-slave-2
    restart: unless-stopped
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes-6379.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redis123}
      --masterauth ${REDIS_PASSWORD:-redis123}
    ports:
      - "6383:6379"
      - "16383:16379"
    volumes:
      - redis_slave2_data:/data
    networks:
      - stock-race-network
    deploy:
      resources:
        limits:
          memory: 5G

  # Slave 3
  redis-slave-3:
    image: redis:7-alpine
    container_name: stock-race-redis-slave-3
    restart: unless-stopped
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes-6379.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redis123}
      --masterauth ${REDIS_PASSWORD:-redis123}
    ports:
      - "6384:6379"
      - "16384:16379"
    volumes:
      - redis_slave3_data:/data
    networks:
      - stock-race-network
    deploy:
      resources:
        limits:
          memory: 5G

  # Cluster Setup Helper
  redis-cluster-setup:
    image: redis:7-alpine
    container_name: stock-race-redis-cluster-setup
    command: >
      sh -c "
        sleep 5 &&
        redis-cli --cluster create
          redis-master-1:6379
          redis-master-2:6379
          redis-master-3:6379
          redis-slave-1:6379
          redis-slave-2:6379
          redis-slave-3:6379
          --cluster-replicas 1
          --cluster-yes
          -a ${REDIS_PASSWORD:-redis123}
      "
    networks:
      - stock-race-network
    depends_on:
      - redis-master-1
      - redis-master-2
      - redis-master-3
      - redis-slave-1
      - redis-slave-2
      - redis-slave-3
    deploy:
      restart_policy:
        condition: none

networks:
  stock-race-network:
    driver: bridge

volumes:
  redis_master1_data:
  redis_master2_data:
  redis_master3_data:
  redis_slave1_data:
  redis_slave2_data:
  redis_slave3_data:
