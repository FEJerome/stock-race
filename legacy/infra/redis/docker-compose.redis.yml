# Redis 渐进式部署配置 - 阶段一：单节点
# 适用场景：个人开发/小范围测试 (<100用户)
# 成本：¥0（本机/Docker）
# 可用性：99%（单点）

version: '3.8'

services:
  # Redis 单节点（阶段一配置）
  redis:
    image: redis:7-alpine
    container_name: stock-race-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --no-appendfsync-on-rewrite yes
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --save ""
      --tcp-keepalive 300
      --timeout 0
      --databases 16
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - stock-race-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # 资源限制（适合个人开发环境）
    deploy:
      resources:
        limits:
          memory: 1.2G
        reservations:
          memory: 256M
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # Redis Commander - Redis管理界面
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: stock-race-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - stock-race-network
    depends_on:
      redis:
        condition: service_healthy

networks:
  stock-race-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
