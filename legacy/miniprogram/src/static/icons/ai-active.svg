  <path d="M30 22 L32 12 Q40.5 8 49 12 L51 22" fill="#1A365D" stroke="#1A365D" stroke-width="2"/>
  <ellipse cx="40.5" cy="12" rx="8.5" ry="3" fill="#1A365D" stroke="#1A365D" stroke-width="2"/>

  <!-- 帽子装饰带 -->
