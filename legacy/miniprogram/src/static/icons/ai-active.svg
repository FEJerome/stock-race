  <!-- 头部 -->
  <circle cx="40.5" cy="38" r="14" fill="#F5F5DC" stroke="#1A365D" stroke-width="2"/>

  <!-- 齿轮眼睛 - 左 -->
  <circle cx="35" cy="36" r="4" fill="#F5F5DC" stroke="#1A365D" stroke-width="1.5"/>
  <circle cx="35" cy="36" r="1.8" fill="#D4AF37"/>
  <line x1="35" y1="30.5" x2="35" y2="32" stroke="#1A365D" stroke-width="1.2"/>
  <line x1="35" y1="40" x2="35" y2="41.5" stroke="#1A365D" stroke-width="1.2"/>
  <line x1="29.5" y1="36" x2="31" y2="36" stroke="#1A365D" stroke-width="1.2"/>
  <line x1="39" y1="36" x2="40.5" y2="36" stroke="#1A365D" stroke-width="1.2"/>

  <!-- 齿轮眼睛 - 右 -->
  <circle cx="46" cy="36" r="4" fill="#F5F5DC" stroke="#1A365D" stroke-width="1.5"/>
  <circle cx="46" cy="36" r="1.8" fill="#D4AF37"/>
  <line x1="46" y1="30.5" x2="46" y2="32" stroke="#1A365D" stroke-width="1.2"/>
  <line x1="46" y1="40" x2="46" y2="41.5" stroke="#1A365D" stroke-width="1.2"/>
  <line x1="40.5" y1="36" x2="42" y2="36" stroke="#1A365D" stroke-width="1.2"/>
  <line x1="50" y1="36" x2="51.5" y2="36" stroke="#1A365D" stroke-width="1.2"/>

  <!-- 领结 -->
  <path d="M35 50 L40.5 53 L46 50 L40.5 47 Z" fill="#D4AF37" stroke="#1A365D" stroke-width="1.5"/>
  <circle cx="40.5" cy="50" r="2.2" fill="#D4AF37" stroke="#1A365D" stroke-width="0.5"/>

  <!-- 身体/西装领子 -->
  <path d="M28 55 L35 50 L40.5 58 L46 50 L53 55" fill="#1A365D" stroke="#1A365D" stroke-width="2" stroke-linejoin="round"/>

  <!-- 机械细节装饰 -->
  <circle cx="28" cy="58" r="2.2" fill="#D4AF37" stroke="#1A365D" stroke-width="1"/>
  <circle cx="53" cy="58" r="2.2" fill="#D4AF37" stroke="#1A365D" stroke-width="1"/>

  <!-- 底部装饰 -->
  <path d="M32 65 Q40.5 69 49 65" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round"/>
