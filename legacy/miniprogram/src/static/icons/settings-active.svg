<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 81 81" width="81" height="81">
  <!-- 西式复古精英风格 - 设置图标（选中状态） -->
  <!-- 背景 -->
  <circle cx="40.5" cy="40.5" r="38" fill="#1A365D" opacity="0.1"/>

  <!-- 装饰圆环 -->
  <circle cx="40.5" cy="40.5" r="36" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>

  <!-- 外圈齿轮 -->
  <circle cx="40.5" cy="40.5" r="28" fill="#F5F5DC" stroke="#1A365D" stroke-width="2"/>

  <!-- 齿轮齿 - 12个 -->
  <rect x="38" y="8" width="5" height="6" fill="#1A365D" stroke="#1A365D" stroke-width="1.5"/>
  <rect x="38" y="67" width="5" height="6" fill="#1A365D" stroke="#1A365D" stroke-width="1.5"/>
  <rect x="8" y="38" width="6" height="5" fill="#1A365D" stroke="#1A365D" stroke-width="1.5"/>
  <rect x="67" y="38" width="6" height="5" fill="#1A365D" stroke="#1A365D" stroke-width="1.5"/>

  <!-- 对角齿 -->
  <rect x="17" y="17" width="5" height="5" fill="#1A365D" stroke="#1A365D" stroke-width="1.2" transform="rotate(45 19.5 19.5)"/>
  <rect x="59" y="17" width="5" height="5" fill="#1A365D" stroke="#1A365D" stroke-width="1.2" transform="rotate(45 61.5 19.5)"/>
  <rect x="17" y="59" width="5" height="5" fill="#1A365D" stroke="#1A365D" stroke-width="1.2" transform="rotate(45 19.5 61.5)"/>
  <rect x="59" y="59" width="5" height="5" fill="#1A365D" stroke="#1A365D" stroke-width="1.2" transform="rotate(45 61.5 61.5)"/>

  <!-- 装饰性刻度 -->
  <line x1="40.5" y1="14" x2="40.5" y2="17" stroke="#D4AF37" stroke-width="1.5"/>
  <line x1="40.5" y1="64" x2="40.5" y2="67" stroke="#D4AF37" stroke-width="1.5"/>
  <line x1="14" y1="40.5" x2="17" y2="40.5" stroke="#D4AF37" stroke-width="1.5"/>
  <line x1="64" y1="40.5" x2="67" y2="40.5" stroke="#D4AF37" stroke-width="1.5"/>

  <!-- 内圈 -->
  <circle cx="40.5" cy="40.5" r="20" fill="none" stroke="#1A365D" stroke-width="2"/>

  <!-- 中心装饰 - 复古罗盘风格 -->
  <circle cx="40.5" cy="40.5" r="12" fill="#F5F5DC" stroke="#D4AF37" stroke-width="2.5"/>

  <!-- 十字指针 -->
  <line x1="40.5" y1="28.5" x2="40.5" y2="36" stroke="#1A365D" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40.5" y1="45" x2="40.5" y2="52.5" stroke="#1A365D" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28.5" y1="40.5" x2="36" y2="40.5" stroke="#1A365D" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="45" y1="40.5" x2="52.5" y2="40.5" stroke="#1A365D" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 中心点 -->
  <circle cx="40.5" cy="40.5" r="4.5" fill="#D4AF37" stroke="#1A365D" stroke-width="1.5"/>
  <circle cx="40.5" cy="40.5" r="2.5" fill="#1A365D"/>

  <!-- 装饰性小圆点 -->
  <circle cx="40.5" cy="22" r="2" fill="#D4AF37"/>
  <circle cx="40.5" cy="59" r="2" fill="#D4AF37"/>
  <circle cx="22" cy="40.5" r="2" fill="#D4AF37"/>
  <circle cx="59" cy="40.5" r="2" fill="#D4AF37"/>
</svg>