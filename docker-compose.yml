version: '3.8'

services:
  # PostgreSQL Database (for metadata)
  postgres:
    image: postgres:15-alpine
    container_name: stock-race-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stock_race
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stock-race-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TimescaleDB (for time-series data)
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: stock-race-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: stock_race_tsdb
      POSTGRES_USER: timescale
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./docker/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stock-race-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timescale"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache - 阶段一：单节点配置
  # 适用场景：个人开发/小范围测试 (<100用户)
  # 成本：¥0（本机/Docker）
  # 可用性：99%（单点）
  redis:
    image: redis:7-alpine
    container_name: stock-race-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --no-appendfsync-on-rewrite yes
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --save ""
      --tcp-keepalive 300
      --timeout 0
      --databases 16
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - stock-race-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # 资源限制（适合个人开发环境）
    deploy:
      resources:
        limits:
          memory: 1.2G
        reservations:
          memory: 256M
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: stock-race-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=stock_race
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:3000
      - AI_SERVICE_URL=http://trading-ai-service:8000
      - DATA_SERVICE_URL=http://market-data-service:8001
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - stock-race-network
    command: npm run dev

  # Trading AI Service (交易决策AI服务)
  trading-ai-service:
    build:
      context: ./trading-ai-service
      dockerfile: Dockerfile.dev
    container_name: stock-race-trading-ai-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=True
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=stock_race
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379
      - BACKEND_URL=http://backend:3001
      - MARKET_DATA_SERVICE_URL=http://market-data-service:8001
    ports:
      - "8000:8000"
    volumes:
      - ./trading-ai-service:/app
    networks:
      - stock-race-network
    command: python -m uvicorn ai_service.main:app --host 0.0.0.0 --port 8000 --reload

  # Market Data Service (市场行情数据服务)
  market-data-service:
    build:
      context: ./market-data-service
      dockerfile: Dockerfile.dev
    container_name: stock-race-market-data-service
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - DEBUG=True
      - TSDB_HOST=timescaledb
      - TSDB_PORT=5432
      - TSDB_NAME=stock_race_tsdb
      - TSDB_USER=timescale
      - TSDB_PASSWORD=password
      - REDIS_URL=redis://redis:6379
      - BACKEND_URL=http://backend:3001
      - TRADING_AI_SERVICE_URL=http://trading-ai-service:8000
    ports:
      - "8001:8001"
    volumes:
      - ./market-data-service:/app
    networks:
      - stock-race-network
    command: python -m uvicorn data_service.main:app --host 0.0.0.0 --port 8001 --reload

  # Frontend Development Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: stock-race-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - trading-ai-service
      - market-data-service
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - stock-race-network
    command: npm run dev

  # pgAdmin (Database Management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: stock-race-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@stock-race.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - stock-race-network

  # Redis Commander (Redis Management)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: stock-race-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - stock-race-network

networks:
  stock-race-network:
    driver: bridge

volumes:
  postgres_data:
  timescaledb_data:
  redis_data:
  pgadmin_data: