    /* ============================================
       STOCK-RACE DESIGN SYSTEM - Demo Edition
       ============================================ */
    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #0d1220;
      --bg-tertiary: #111827;

      --surface-primary: #141b2d;
      --surface-secondary: #1a2332;
      --surface-elevated: #1e2943;
      --surface-hover: #252f4a;

      --glass-bg: rgba(20, 27, 45, 0.8);
      --glass-border: rgba(255, 255, 255, 0.08);

      --up-primary: #00d084;
      --up-secondary: #00b870;
      --up-glow: rgba(0, 208, 132, 0.4);
      --up-bg: rgba(0, 208, 132, 0.15);

      --down-primary: #ff4757;
      --down-secondary: #e03e4c;
      --down-glow: rgba(255, 71, 87, 0.4);
      --down-bg: rgba(255, 71, 87, 0.15);

      --neutral-primary: #8b9dc3;
      --neutral-secondary: #5a6a8a;
      --neutral-muted: #3d4a63;

      --accent-cyan: #00d4ff;
      --accent-cyan-glow: rgba(0, 212, 255, 0.5);
      --accent-cyan-bg: rgba(0, 212, 255, 0.15);

      --accent-gold: #ffd700;
      --accent-gold-light: #ffed4e;

      --text-primary: #ffffff;
      --text-secondary: #a0aec0;
      --text-muted: #64748b;

      --border-primary: rgba(255, 255, 255, 0.1);
      --border-secondary: rgba(255, 255, 255, 0.06);
      --border-accent: rgba(0, 212, 255, 0.3);

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.5);
      --shadow-glow-cyan: 0 0 20px rgba(0, 212, 255, 0.3);

      --font-mono: 'SF Mono', 'Roboto Mono', monospace;
      --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.125rem;
      --text-xl: 1.25rem;
      --text-2xl: 1.5rem;
      --text-3xl: 1.875rem;

      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;

      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-full: 9999px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: var(--font-body);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Typography */
    .font-mono {
      font-family: var(--font-mono);
    }

    /* Colors */
    .text-up { color: var(--up-primary); }
    .text-down { color: var(--down-primary); }
    .text-muted { color: var(--text-muted); }
    .text-secondary { color: var(--text-secondary); }
    .text-cyan { color: var(--accent-cyan); }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-cyan), #00a8cc);
      color: #000;
    }

    .btn-primary:hover {
      box-shadow: var(--shadow-glow-cyan);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--surface-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border-primary);
    }

    .btn-secondary:hover {
      background: var(--surface-hover);
      border-color: var(--border-accent);
    }

    /* Cards */
    .card {
      background: var(--surface-primary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      transition: all 0.3s;
    }

    .card:hover {
      border-color: var(--border-accent);
      box-shadow: var(--shadow-lg), 0 0 30px rgba(0, 212, 255, 0.1);
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      font-size: var(--text-xs);
      font-weight: 600;
    }

    .badge-bronze {
      background: linear-gradient(135deg, #cd7f32 0%, #e6a855 100%);
      color: #fff;
      box-shadow: 0 2px 8px rgba(205, 127, 50, 0.4);
    }

    .badge-silver {
      background: linear-gradient(135deg, #9ca3af 0%, #d1d5db 50%, #9ca3af 100%);
      color: #374151;
      box-shadow: 0 2px 8px rgba(156, 163, 175, 0.4);
    }

    .badge-gold {
      background: linear-gradient(135deg, #fbbf24 0%, #fcd34d 50%, #f59e0b 100%);
      color: #78350f;
      box-shadow: 0 2px 12px rgba(251, 191, 36, 0.5);
    }

    /* Status dots */
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-dot.active {
      background: var(--up-primary);
      box-shadow: 0 0 5px var(--up-primary), 0 0 10px var(--up-glow);
      animation: breathing 2s ease-in-out infinite;
    }

    .status-dot.paused {
      background: var(--neutral-muted);
    }

    @keyframes breathing {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* Animations */
    .fade-enter {
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .slide-enter {
      animation: slideIn 0.4s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* Navigation */
    .nav-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-6);
      z-index: 100;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--text-xl);
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      gap: var(--space-6);
    }

    .nav-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: var(--text-sm);
      font-weight: 500;
      transition: color 0.2s;
      padding: var(--space-2) 0;
      border-bottom: 2px solid transparent;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text-primary);
      border-bottom-color: var(--accent-cyan);
    }

    /* Main content */
    .main-content {
      padding-top: 84px;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: var(--space-6);
    }

    /* Page title */
    .page-title {
      font-size: var(--text-3xl);
      font-weight: 700;
      margin-bottom: var(--space-6);
    }

    /* Metric cards */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-4);
      margin-bottom: var(--space-6);
    }

    .metric-card {
      background: var(--surface-primary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      position: relative;
      overflow: hidden;
    }

    .metric-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-gold));
      opacity: 0.5;
    }

    .metric-label {
      font-size: var(--text-xs);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: var(--space-2);
    }

    .metric-value {
      font-family: var(--font-mono);
      font-size: var(--text-2xl);
      font-weight: 700;
    }

    /* Agent card */
    .agent-card {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      background: var(--surface-primary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      margin-bottom: var(--space-3);
      cursor: pointer;
      transition: all 0.3s;
    }

    .agent-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-accent);
      box-shadow: var(--shadow-lg), 0 0 30px rgba(0, 212, 255, 0.1);
    }

    .agent-avatar {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: var(--text-xl);
      color: white;
    }

    .agent-info {
      flex: 1;
    }

    .agent-name {
      font-size: var(--text-base);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .agent-model {
      font-size: var(--text-xs);
      color: var(--text-muted);
    }

    .agent-return {
      text-align: right;
      min-width: 100px;
    }

    .return-value {
      font-family: var(--font-mono);
      font-size: var(--text-lg);
      font-weight: 700;
    }

    .return-bar {
      height: 6px;
      background: var(--surface-secondary);
      border-radius: var(--radius-full);
      margin-top: var(--space-1);
      overflow: hidden;
    }

    .return-bar-fill {
      height: 100%;
      border-radius: var(--radius-full);
      transition: width 1s ease;
    }

    /* Progress bar */
    .progress-bar {
      height: 8px;
      background: var(--surface-secondary);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: var(--radius-full);
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-gold));
      transition: width 1s ease;
    }

    /* Decision timeline */
    .timeline {
      position: relative;
      padding-left: 32px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 11px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--surface-secondary);
    }

    .timeline-item {
      position: relative;
      padding-bottom: var(--space-5);
    }

    .timeline-dot {
      position: absolute;
      left: -26px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      background: var(--surface-elevated);
      border: 2px solid var(--border-primary);
    }

    .timeline-dot.buy {
      background: var(--up-bg);
      border-color: var(--up-primary);
      color: var(--up-primary);
    }

    .timeline-dot.sell {
      background: var(--down-bg);
      border-color: var(--down-primary);
      color: var(--down-primary);
    }

    .timeline-dot.hold {
      background: var(--surface-secondary);
      border-color: var(--neutral-muted);
      color: var(--neutral-primary);
    }

    .timeline-content {
      background: var(--surface-secondary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-md);
      padding: var(--space-3);
    }

    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-2);
    }

    .timeline-title {
      font-weight: 600;
    }

    .timeline-time {
      font-size: var(--text-xs);
      color: var(--text-muted);
    }

    .timeline-reason {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.5;
      padding: var(--space-2);
      background: var(--surface-primary);
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--accent-cyan);
      margin-top: var(--space-2);
    }

    /* Table */
    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table th,
    .data-table td {
      padding: var(--space-3) var(--space-4);
      text-align: left;
      border-bottom: 1px solid var(--border-primary);
    }

    .data-table th {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--surface-secondary);
    }

    .data-table tr:hover {
      background: var(--surface-hover);
    }

    /* Chart containers */
    .chart-container {
      background: var(--surface-primary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      height: 400px;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .metric-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .nav-links {
        display: none;
      }
    }

    @media (max-width: 640px) {
      .metric-grid {
        grid-template-columns: 1fr;
      }

      .agent-card {
        flex-wrap: wrap;
      }
    }

    /* Page transitions */
    .page-enter-active,
    .page-leave-active {
      transition: all 0.3s ease;
    }

    .page-enter-from {
      opacity: 0;
      transform: translateX(20px);
    }

    .page-leave-to {
      opacity: 0;
      transform: translateX(-20px);
    }
  </style>
</head>

      const display = ref(0);
      let rafId = null;

      const animate = (targetValue) => {
        const startTime = performance.now();
        const startValue = display.value;

        const update = (currentTime) => {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const easeProgress = 1 - Math.pow(1 - progress, 3);

          display.value = startValue + (targetValue - startValue) * easeProgress;

          if (progress < 1) {
            rafId = requestAnimationFrame(update);
          }
        };

        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(update);
      };

      onUnmounted(() => {
        if (rafId) cancelAnimationFrame(rafId);
      });

      return { display, animate };
    }

                  <th style="text-align: right;">涨跌幅</th>
                  <th style="text-align: right;">成交量</th>
                  <th style="text-align: center;">趋势</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="(stock, index) in market" :key="stock.symbol"
                    style="animation: fadeIn 0.3s ease forwards; animation-delay: {{ index * 0.05 }}s; opacity: 0;">
                  <td class="font-mono">{{ stock.symbol }}</td>
                  <td>{{ stock.name }}</td>
                  <td style="text-align: right;" class="font-mono">¥{{ stock.price.toFixed(2) }}</td>
                  <td style="text-align: right;" class="font-mono" :class="stock.change >= 0 ? 'text-up' : 'text-down'">
                    {{ (stock.change >= 0 ? '+' : '') + stock.change.toFixed(2) }}
                  </td>
                  <td style="text-align: right;" class="font-mono" :class="stock.changePercent >= 0 ? 'text-up' : 'text-down'">
                    {{ (stock.changePercent >= 0 ? '+' : '') + stock.changePercent.toFixed(2) }}%
                  </td>
                  <td style="text-align: right;" class="font-mono">{{ (stock.volume / 10000).toFixed(0) }}万</td>
                  <td style="text-align: center;">
                    <span :style="{ color: stock.trend === 'up' ? 'var(--up-primary)' : stock.trend === 'down' ? 'var(--down-primary)' : 'var(--neutral-primary)', fontSize: '16px' }">
                      {{ stock.trend === 'up' ? '↑' : stock.trend === 'down' ? '↓' : '→' }}
                    </span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      `
    };

    // Router
    const router = createRouter({
      history: createWebHashHistory(),
      routes: [
        { path: '/', component: Dashboard },
        { path: '/agents', component: Agents },
        { path: '/agent/:id', component: AgentDetail },
        { path: '/market', component: Market }
      ]
    });

    // App
    const app = createApp({});
    app.use(router);
    app.mount('#app');
  </script>
</body>
</html>
